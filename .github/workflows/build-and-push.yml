name: Build and push images

on:
  push:
    branches:
      - main
  workflow_dispatch:  # also allow manual triggering from the Actions UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repo owner
        id: vars
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/dockercomposeproj-backend:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/dockercomposeproj-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/my-react-app
          file: ./frontend/my-react-app/Dockerfile
          target: runner
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/dockercomposeproj-frontend:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/dockercomposeproj-frontend:${{ github.sha }}
